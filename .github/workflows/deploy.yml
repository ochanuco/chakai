name: deploy
run-name: deploy chakai @ ${{ inputs.ref || github.sha }}

# main への push で本番に出す。承認は deploy-plan が危ないと判定したとき（前回の記録なし・ロールバック・
# 追加系でない D1 migration）だけ、Environment production-approval で止まる。手動実行はロールバック用
on:
  push:
    branches: [main]
    paths:
      - worker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/deploy/production.env.op
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA。古い SHA はロールバック）
        required: true
        default: main

permissions:
  contents: read

# run 全体を直列にする。名前は deploy.yml のジョブの concurrency（deploy-production）と変える
concurrency:
  group: deploy-run-production
  cancel-in-progress: false

jobs:
  plan:
    uses: ochanuco/.github/.github/workflows/deploy-plan.yml@194995de7425c6457f8d802510787afd02ed9235 # v1.7.0
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref || 'main' }}
      approval-environment: production-approval
      migrations: worker/migrations/
  deploy:
    needs: plan
    uses: ochanuco/.github/.github/workflows/deploy.yml@194995de7425c6457f8d802510787afd02ed9235 # v1.7.0
    with:
      ref: ${{ needs.plan.outputs.sha }}
      approval-environment: ${{ needs.plan.outputs.approval-environment }}
      op-env-file: .github/deploy/production.env.op
      run: worker/scripts/deploy.sh production
    secrets: inherit
