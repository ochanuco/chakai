name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # postinstall の `wrangler types` が worker-configuration.d.ts を生成する（gitignore 済み）
  ci:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0
    with:
      run: |
        pnpm run typecheck
        pnpm run lint
        pnpm test
        pnpm run build
